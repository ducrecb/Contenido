name: Actualizar Lista de Reproduccion

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 04:00 AM hora de Paraguay
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de Python
        run: python actualizar.py
